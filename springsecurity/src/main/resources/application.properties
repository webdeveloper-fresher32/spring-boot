# =============================================
# SERVER
# =============================================
server.port=8080

# =============================================
# PostgreSQL Database Configuration
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/spring-security
spring.datasource.username=postgres
spring.datasource.password=0000


#Hibernate Settings
# spring.jpa.hibernate.ddl-auto=update: This automatically creates or updates your database tables in PostgreSQL whenever you create Java @Entity classes. You don't have to manually write CREATE TABLE SQL in pgAdmin!
spring.jpa.hibernate.ddl-auto=update

# spring.jpa.show-sql=true & format_sql=true : Yes, this logs the exact SQL queries Hibernate generates and formats them nicely so you can observe the query Spring Security runs to load a user.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =============================================
# SPRING SECURITY - Default test credentials
# (Overrides the auto-generated UUID password)
# =============================================
spring.security.user.name=user
spring.security.user.password=password123

# =============================================
# LOGGING - See security filters in action
# =============================================
logging.level.org.springframework.security=DEBUG
